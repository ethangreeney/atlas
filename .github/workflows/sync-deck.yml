# Every Monday, pulls Ultimate Geography's latest source and opens a pull request if anything we ship changed, with
# the change list in the description. Review it (the deck gets things wrong now and then; corrections go in
# scripts/deck-overrides.ts), merge, deploy. Run it by hand from the Actions tab too.
# Needs Settings → Actions → General → "Allow GitHub Actions to create and approve pull requests".
name: Sync deck

on:
  schedule:
    - cron: '0 18 * * 0' # Monday 6–7am in New Zealand
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Pull the deck
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pnpm -s sync:deck | tee "$RUNNER_TEMP/report.txt"
          # New or removed places need a spot in the order new cards are introduced.
          if grep -qE '^(added|removed) ' "$RUNNER_TEMP/report.txt"; then pnpm -s build:fame; fi
          {
            echo 'Ultimate Geography changed upstream. Against the deck the app ships now:'
            echo
            echo '```'
            cat "$RUNNER_TEMP/report.txt"
            echo '```'
            echo
            echo 'Check each change is right before merging. To keep the current version of something, add it to `scripts/deck-overrides.ts` and run `pnpm sync:deck` on this branch. Merging does not deploy.'
          } > "$RUNNER_TEMP/body.md"

      - uses: peter-evans/create-pull-request@v7
        with:
          branch: deck-sync
          delete-branch: true
          add-paths: |
            src/data
            public/media
          commit-message: Pull Ultimate Geography updates
          title: Pull Ultimate Geography updates
          body-path: ${{ runner.temp }}/body.md
