# Every Monday, pulls Ultimate Geography's latest source and opens a pull request if anything we ship changed, with
# the change list in the description. Review it (the deck gets things wrong now and then; corrections go in
# scripts/deck-overrides.ts), merge, deploy. Run it by hand from the Actions tab too.
# Needs Settings → Actions → General → "Allow GitHub Actions to create and approve pull requests".
name: Sync deck

on:
  schedule:
    - cron: '0 18 * * 0' # Monday 6–7am in New Zealand
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Pull the deck
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pnpm -s sync:deck | tee "$RUNNER_TEMP/report.txt"
          # Keeps the hand-ranked order new cards come in up to date: new places go in by Wikipedia links, marked for review.
          pnpm -s build:fame | tee "$RUNNER_TEMP/fame.txt"
          {
            echo 'Ultimate Geography changed upstream. Against the deck the app ships now:'
            echo
            echo '```'
            cat "$RUNNER_TEMP/report.txt"
            echo '```'
            echo
            if grep -q '^placed ' "$RUNNER_TEMP/fame.txt"; then
              echo 'New places went into the order new cards come in by how often Wikipedia links to them, which undersells places everyone knows but few articles mention (seas especially):'
              echo
              echo '```'
              cat "$RUNNER_TEMP/fame.txt"
              echo '```'
              echo
              echo 'Each is marked `review` in `src/data/fame.json`. Check its spot (or ask Claude to), move its line if it belongs elsewhere, and delete the `review` field.'
              echo
            fi
            echo 'Check each change is right before merging. To keep the current version of something, add it to `scripts/deck-overrides.ts` and run `pnpm sync:deck` on this branch. Merging does not deploy.'
          } > "$RUNNER_TEMP/body.md"

      - uses: peter-evans/create-pull-request@v7
        with:
          branch: deck-sync
          delete-branch: true
          add-paths: |
            src/data
            public/media
          commit-message: Pull Ultimate Geography updates
          title: Pull Ultimate Geography updates
          body-path: ${{ runner.temp }}/body.md
